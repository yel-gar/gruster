[package]
name = "gruster"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
argon2 = "0.5.3"
eframe = { version = "0.36.0", default-features = false, features = ["glow"] }
egui = "0.36.0"
egui_extras = { version = "0.36.1",features = ["image"] }
image = { version = "0.25.10", features = ["png"] }
rand = "0.10.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3"] }
